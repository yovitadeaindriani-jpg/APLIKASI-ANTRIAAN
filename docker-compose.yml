services:
# --------------------------------------------------------------------------
# Database. Sejak Minggu 10 punya schema dan data awal.
#
  mysql:
    image: mysql:8.0
    container_name: queueapp-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      # host:container — port host dibuat berbeda agar tidak bentrok
      # dengan MySQL yang mungkin sudah terpasang di komputer sendiri.
      - "${DB_HOST_PORT}:3306"

    volumes:
      # Named volume: data tetap ada walaupun container dihapus.
      # Inilah yang membuat data antrean bertahan melewati `docker compose down`.
      - mysql_data:/var/lib/mysql
      # Berkas .sql dijalankan MySQL menurut urutan abjad,
      # hanya ketika volume datanya masih kosong.
      - ./database:/docker-entrypoint-initdb.d:ro
      # MySQL harus siap menerima koneksi sebelum server dijalankan.

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - queueapp

  # --------------------------------------------------------------------------
  # Backend Express
  # --------------------------------------------------------------------------

  server:
    image: node:20-alpine
    container_name: queueapp-server
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${SERVER_PORT}:${PORT}"
    command: >
      sh -c "cmp -s package-lock.json node_modules/.terpasang ||
             { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.terpasang; };
             npm run dev"
    depends_on:
      - mysql:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - queueapp

  web:
    image: node:20-bookworm-slim
    container_name: queueapp-web
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server
    networks:
      - queueapp

volumes:
  mysql_data:

networks:
  queueapp:
    driver: bridge